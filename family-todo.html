<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Family To-Do Board</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #FAF7F0;
    --ink: #2E2A24;
    --preschool: #F4C95D;
    --appt: #E37B5D;
    --shopping: #7FA37A;
    --household: #6E8FA8;
    --dog: #B08968;
    --muted: #9A9284;
    --mike: #3E6B8A;
    --meesh: #A85D72;
    --shared: #6B7F5E;
    --overdue: #8C2F22;
    --today: #D9483A;
    --soon: #C98A2C;
    --action: #8A5A3E;
    --later: #9C9484;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    background-image: radial-gradient(circle at 1px 1px, rgba(0,0,0,0.035) 1px, transparent 0);
    background-size: 18px 18px;
    color: var(--ink);
    font-family: 'Inter', system-ui, sans-serif;
    min-height: 100vh;
    padding: 20px 14px 90px;
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  header { margin-bottom: 14px; }
  h1 { font-family: 'Poppins', sans-serif; font-size: 1.3rem; margin: 0 0 3px; letter-spacing: -0.01em; }
  .sub { font-size: 0.78rem; color: var(--muted); }

  .banner { background: #FBEAE3; color: #8A3B24; border: 1px solid #E37B5D; border-radius: 10px; padding: 8px 12px; font-size: 0.76rem; margin-bottom: 14px; }

  .group-toggle { display: flex; gap: 4px; background: #F2EDE2; border-radius: 10px; padding: 4px; margin-bottom: 12px; width: fit-content; overflow-x: auto; }
  .group-toggle button { border: none; background: transparent; padding: 5px 11px; border-radius: 8px; font-size: 0.76rem; font-weight: 600; font-family: inherit; color: var(--muted); cursor: pointer; white-space: nowrap; }
  .group-toggle button.active { background: var(--ink); color: var(--paper); }

  .add-toggle-btn { display: flex; align-items: center; gap: 6px; padding: 9px 14px; border-radius: 10px; border: none; background: var(--ink); color: var(--paper); font-weight: 600; font-size: 0.84rem; cursor: pointer; margin-bottom: 12px; }

  .add-panel { background: #fff; border: 1px solid #E2DACB; border-radius: 12px; padding: 14px; margin-bottom: 16px; }
  .add-panel input[type="text"], .add-panel textarea, .add-panel select, .add-panel input[type="number"], .add-panel input[type="date"] {
    width: 100%; padding: 8px 10px; border-radius: 8px; border: 1.5px solid #E2DACB; font-size: 0.84rem; font-family: inherit; background: #fff; margin-bottom: 8px;
  }
  .add-panel textarea { min-height: 60px; resize: vertical; }
  .add-row-inline { display: flex; gap: 8px; }
  .add-row-inline > * { flex: 1; }
  .field-label { font-size: 0.7rem; color: var(--muted); margin: 4px 0 3px; font-weight: 600; }
  .add-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 6px; }
  .btn-primary { padding: 7px 15px; border-radius: 8px; border: none; background: var(--ink); color: var(--paper); font-weight: 600; font-size: 0.8rem; cursor: pointer; }
  .btn-ghost { padding: 7px 13px; border-radius: 8px; border: none; background: transparent; color: var(--muted); font-size: 0.8rem; cursor: pointer; }

  .hide-toggle { display: flex; align-items: center; gap: 6px; font-size: 0.78rem; color: var(--muted); margin-bottom: 14px; cursor: pointer; user-select: none; }
  .hide-toggle input { accent-color: var(--ink); width: 14px; height: 14px; }

  .category { margin-bottom: 18px; }
  .cat-label-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .cat-label { display: inline-flex; align-items: center; gap: 6px; font-family: 'Poppins', sans-serif; font-size: 0.78rem; font-weight: 600; padding: 3px 9px; border-radius: 20px; background: #F2EDE2; }
  .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
  .quick-add-btn { border: none; background: #F2EDE2; color: var(--ink); width: 21px; height: 21px; border-radius: 50%; font-size: 0.85rem; font-weight: 700; cursor: pointer; line-height: 1; }

  .card { background: #fff; border-radius: 12px; padding: 2px 6px; box-shadow: 0 1px 2px rgba(0,0,0,0.05); border: 1px solid #EFE9DC; }
  .item { padding: 7px 6px; border-bottom: 1px solid #F2EDE2; }
  .item:last-child { border-bottom: none; }
  .item-top { display: flex; align-items: center; gap: 8px; }
  .item input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--ink); flex-shrink: 0; }
  .content-row { display: flex; flex-wrap: wrap; align-items: center; gap: 5px 7px; }
  .item-text { font-size: 0.85rem; line-height: 1.3; cursor: pointer; min-width: 0; }
  .item-text:active { opacity: 0.6; }
  .item.done .item-text { text-decoration: line-through; color: var(--muted); }
  .item.pending { opacity: 0.5; }
  .del-btn { background: none; border: none; color: var(--muted); font-size: 1rem; cursor: pointer; padding: 0 4px; line-height: 1; flex-shrink: 0; }

  .badge { font-size: 0.63rem; font-weight: 600; padding: 1px 7px; border-radius: 10px; color: #fff; white-space: nowrap; }
  .badge-outline { font-size: 0.63rem; font-weight: 600; padding: 1px 7px; border-radius: 10px; border: 1px solid currentColor; white-space: nowrap; }

  .type-actions { display: flex; align-items: center; gap: 6px; margin-top: 5px; flex-wrap: wrap; }
  .btn-sm { padding: 4px 9px; border-radius: 7px; border: none; font-size: 0.7rem; font-weight: 600; cursor: pointer; color: #fff; background: var(--shared); display: inline-flex; align-items: center; gap: 4px; }
  .btn-sm.reopen { background: transparent; color: var(--muted); border: 1px solid #E2DACB; }
  .date-input-sm { padding: 4px 7px; border-radius: 7px; border: 1px solid #E2DACB; font-size: 0.7rem; font-family: inherit; }

  .progress-bar { height: 4px; background: #F2EDE2; border-radius: 3px; overflow: hidden; margin-top: 5px; }
  .progress-fill { height: 100%; background: var(--shared); }
  .subtasks { margin-top: 5px; padding-left: 2px; }
  .subtask { display: flex; align-items: center; gap: 7px; font-size: 0.78rem; color: var(--ink); padding: 2px 0; }
  .subtask input { width: 13px; height: 13px; accent-color: var(--ink); }
  .subtask.done { color: var(--muted); text-decoration: line-through; }
  .expand-btn { background: none; border: none; color: var(--muted); font-size: 0.7rem; cursor: pointer; padding: 3px 0; }

  .empty-cat { font-size: 0.8rem; color: var(--muted); padding: 8px 6px; font-style: italic; }
  .loading, .fatal { text-align: center; color: var(--muted); padding: 40px 20px; font-size: 0.9rem; }
  .fatal { color: #8A3B24; }

  /* Edit form */
  .edit-form { padding: 2px 0; }
  .edit-form input[type="text"], .edit-form select, .edit-form input[type="number"], .edit-form input[type="date"], .edit-form textarea {
    width: 100%; padding: 8px 9px; border-radius: 8px; border: 1.5px solid #E2DACB; font-size: 0.88rem; font-family: inherit; background: #fff; margin-bottom: 7px;
  }
  .edit-row { display: flex; gap: 8px; }
  .edit-row > * { flex: 1; }
  .edit-subtask-row { display: flex; align-items: center; gap: 6px; margin-bottom: 5px; }
  .edit-subtask-row input[type="text"] { margin-bottom: 0; }
  .edit-subtask-row button { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 0.9rem; }
  .edit-add-step { font-size: 0.78rem; color: var(--muted); background: none; border: none; cursor: pointer; padding: 3px 0; margin-bottom: 6px; }
  .edit-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }

  /* Toast */
  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 10px 12px 10px 16px; border-radius: 10px; display: none; align-items: center; gap: 14px; font-size: 0.85rem; box-shadow: 0 4px 14px rgba(0,0,0,0.2); z-index: 50; max-width: calc(100% - 28px); }

  .summary-line { font-size: 0.85rem; font-weight: 600; margin-bottom: 14px; }
  .summary-line.calm { color: var(--muted); font-weight: 500; }
  .toast-undo { background: rgba(255,255,255,0.15); border: none; color: var(--paper); font-weight: 600; padding: 6px 12px; border-radius: 7px; cursor: pointer; font-size: 0.8rem; white-space: nowrap; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Family To-Do Board</h1>
    <div class="sub">Synced to Supabase. Tap a task to edit it.</div>
  </header>

  <div id="summaryLine" class="summary-line"></div>

  <div id="banner-slot"></div>

  <div class="group-toggle" id="groupToggle">
    <button data-group="urgency" class="active">Timeline</button>
    <button data-group="category">Area</button>
    <button data-group="assignee">Person</button>
  </div>

  <button class="add-toggle-btn" id="addToggleBtn">+ Add task</button>

  <div class="add-panel" id="addPanel" style="display:none;">
    <input type="text" id="newItemText" placeholder="Task title" />
    <div class="add-row-inline">
      <div>
        <div class="field-label">Area</div>
        <select id="newItemCat"></select>
      </div>
      <div>
        <div class="field-label">Owner</div>
        <select id="newItemAssignee"></select>
      </div>
    </div>
    <div class="field-label">Type</div>
    <select id="newItemType">
      <option value="simple">Simple to-do</option>
      <option value="recurring">Recurring chore</option>
      <option value="project">Project (with steps)</option>
      <option value="project_simple">Project (simple)</option>
      <option value="appointment">Appointment</option>
    </select>

    <div id="typeExtra-recurring" style="display:none;">
      <div class="field-label">Repeats every (days)</div>
      <input type="number" id="newItemInterval" min="1" value="7" />
    </div>
    <div id="typeExtra-project" style="display:none;">
      <div class="field-label">Steps (one per line)</div>
      <textarea id="newItemSubtasks" placeholder="Measure windows&#10;Order supplies&#10;Install"></textarea>
      <div class="field-label">Due date (optional)</div>
      <input type="date" id="newItemDueProject" />
    </div>
    <div id="typeExtra-simple">
      <div class="field-label">Due date (optional)</div>
      <input type="date" id="newItemDueSimple" />
    </div>

    <div class="add-actions">
      <button class="btn-ghost" id="cancelAddBtn">Cancel</button>
      <button class="btn-primary" id="addBtn">Add</button>
    </div>
  </div>

  <label class="hide-toggle">
    <input type="checkbox" id="hideCompletedToggle" />
    Hide completed items
  </label>

  <div id="board" class="loading">Loading your list...</div>
</div>

<div class="toast" id="toast">
  <span class="toast-msg"></span>
  <button class="toast-undo" id="toastUndoBtn">Undo</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://rmacrimrvkrenlhekjyc.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_vW1vNsIeR5F4edP2OXtfTg_SyPHK8wa';

  const CATEGORIES = [
    { id: 'preschool', label: 'Preschool', color: 'var(--preschool)' },
    { id: 'appt', label: 'Appointments', color: 'var(--appt)' },
    { id: 'shopping', label: 'Shopping', color: 'var(--shopping)' },
    { id: 'household', label: 'Household', color: 'var(--household)' },
    { id: 'dog', label: 'Dog & Pet Care', color: 'var(--dog)' },
  ];
  const ASSIGNEES = [
    { id: 'Mike', label: 'Mike', color: 'var(--mike)' },
    { id: 'Meesh', label: 'Meesh', color: 'var(--meesh)' },
    { id: 'Shared', label: 'Shared', color: 'var(--shared)' },
  ];
  const URGENCY_BUCKETS = [
    { id: 'action', label: 'Needs Scheduling', color: 'var(--action)' },
    { id: 'overdue', label: 'Overdue', color: 'var(--overdue)' },
    { id: 'dueToday', label: 'Due Today', color: 'var(--today)' },
    { id: 'thisWeek', label: 'Due This Week', color: 'var(--soon)' },
    { id: 'upcoming', label: 'Upcoming', color: 'var(--mike)' },
    { id: 'someday', label: 'Someday', color: 'var(--later)' },
  ];
  const TASK_TYPES = [
    { id: 'simple', label: 'Simple to-do' },
    { id: 'recurring', label: 'Recurring chore' },
    { id: 'project', label: 'Project (with steps)' },
    { id: 'project_simple', label: 'Project (simple)' },
    { id: 'appointment', label: 'Appointment' },
  ];
  function typeBadgeLabel(t) {
    if (t === 'recurring') return 'Recurring';
    if (t === 'project' || t === 'project_simple') return 'Project';
    if (t === 'appointment') return 'Appointment';
    return null;
  }

  let items = [];
  let hideCompleted = false;
  let groupBy = 'urgency';
  let expandedIds = new Set();
  let pendingIds = new Set();
  let editingId = null;
  let editDraft = null;
  const apptDateDrafts = {};
  let toastTimer = null;

  const board = document.getElementById('board');
  const summaryLine = document.getElementById('summaryLine');
  const bannerSlot = document.getElementById('banner-slot');
  const newItemText = document.getElementById('newItemText');
  const newItemCat = document.getElementById('newItemCat');
  const newItemAssignee = document.getElementById('newItemAssignee');
  const newItemType = document.getElementById('newItemType');
  const newItemInterval = document.getElementById('newItemInterval');
  const newItemSubtasks = document.getElementById('newItemSubtasks');
  const newItemDueProject = document.getElementById('newItemDueProject');
  const newItemDueSimple = document.getElementById('newItemDueSimple');
  const addBtn = document.getElementById('addBtn');
  const cancelAddBtn = document.getElementById('cancelAddBtn');
  const addToggleBtn = document.getElementById('addToggleBtn');
  const addPanel = document.getElementById('addPanel');
  const hideCompletedToggle = document.getElementById('hideCompletedToggle');
  const groupToggle = document.getElementById('groupToggle');
  const toastEl = document.getElementById('toast');
  const toastMsgEl = toastEl.querySelector('.toast-msg');
  const toastUndoBtn = document.getElementById('toastUndoBtn');

  CATEGORIES.forEach(c => { const o = document.createElement('option'); o.value = c.id; o.textContent = c.label; newItemCat.appendChild(o); });
  ASSIGNEES.forEach(a => { const o = document.createElement('option'); o.value = a.id; o.textContent = a.label; newItemAssignee.appendChild(o); });

  function catMeta(id) { return CATEGORIES.find(c => c.id === id) || CATEGORIES[0]; }
  function assigneeMeta(id) { return ASSIGNEES.find(a => a.id === id) || ASSIGNEES[2]; }

  function todayISO() { const d = new Date(); d.setHours(0,0,0,0); return d.toISOString().slice(0,10); }
  function addDaysISO(iso, n) { const d = new Date(iso + 'T00:00:00'); d.setDate(d.getDate() + n); return d.toISOString().slice(0,10); }
  function fmtDate(iso) { if (!iso) return ''; const d = new Date(iso + 'T00:00:00'); return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }); }
  function diffDaysFromToday(iso) { const today = new Date(); today.setHours(0,0,0,0); const d = new Date(iso + 'T00:00:00'); return Math.round((d - today) / 86400000); }

  async function sb(path, options = {}) {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
      ...options,
      headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json', ...(options.headers || {}) },
    });
    if (!res.ok) {
      const body = await res.text().catch(() => '');
      throw new Error(`Supabase ${options.method || 'GET'} ${path} failed: ${res.status} ${body}`);
    }
    const text = await res.text();
    return text ? JSON.parse(text) : null;
  }

  function showBanner(message) { bannerSlot.innerHTML = ''; const div = document.createElement('div'); div.className = 'banner'; div.textContent = message; bannerSlot.appendChild(div); }
  function clearBanner() { bannerSlot.innerHTML = ''; }

  function showToast(message, onUndo) {
    clearTimeout(toastTimer);
    toastMsgEl.textContent = message;
    toastUndoBtn.style.display = onUndo ? 'inline-flex' : 'none';
    toastUndoBtn.onclick = () => { onUndo && onUndo(); hideToast(); };
    toastEl.style.display = 'flex';
    toastTimer = setTimeout(hideToast, 6000);
  }
  function hideToast() { clearTimeout(toastTimer); toastEl.style.display = 'none'; }

  async function loadAll() {
    try {
      const [todos, settings] = await Promise.all([
        sb('todos?select=*&order=created_at.asc'),
        sb('app_settings?select=key,value'),
      ]);
      items = todos || [];
      const hideRow = (settings || []).find(s => s.key === 'hideCompleted');
      const groupRow = (settings || []).find(s => s.key === 'groupBy');
      hideCompleted = !!(hideRow && hideRow.value === true);
      groupBy = (groupRow && ['assignee','category','urgency'].includes(groupRow.value)) ? groupRow.value : 'urgency';
      hideCompletedToggle.checked = hideCompleted;
      updateGroupToggleUI();
      clearBanner();
      render();
    } catch (e) {
      console.error('Load failed:', e);
      board.className = 'fatal';
      board.textContent = "Couldn't load your list from Supabase. Double check the table columns match what was set up.";
      addToggleBtn.disabled = true;
    }
  }

  function isDone(item) {
    if (item.task_type === 'project') {
      const st = item.subtasks || [];
      if (st.length === 0) return !!item.done; // no steps yet - fall back to a plain done flag
      return st.every(s => s.done);
    }
    if (item.task_type === 'recurring') return false;
    return !!item.done; // simple, project_simple, appointment
  }

  function effectiveDueDate(item) {
    if (item.task_type === 'recurring') return item.next_due || null;
    if (item.task_type === 'appointment') return item.appt_state === 'booked' ? (item.due_date || null) : null;
    return item.due_date || null; // simple, project
  }

  function getUrgency(item) {
    if (item.task_type === 'appointment' && item.appt_state === 'needsScheduling') return 'action';
    const due = effectiveDueDate(item);
    if (!due) return 'someday';
    const diff = diffDaysFromToday(due);
    if (diff < 0) return 'overdue';
    if (diff === 0) return 'dueToday';
    if (diff <= 7) return 'thisWeek';
    if (diff <= 30) return 'upcoming';
    return 'someday';
  }

  function dueBadge(item) {
    if (item.task_type === 'appointment' && item.appt_state === 'needsScheduling') return { text: 'Needs a date', color: 'var(--action)' };
    const due = effectiveDueDate(item);
    if (!due) {
      if (item.task_type === 'recurring') return { text: `every ${item.interval_days}d`, color: 'var(--muted)' };
      return null;
    }
    const diff = diffDaysFromToday(due);
    if (diff < 0) return { text: 'Overdue', color: 'var(--overdue)' };
    if (diff === 0) return { text: 'Today', color: 'var(--today)' };
    if (diff <= 7) return { text: `in ${diff}d`, color: 'var(--soon)' };
    return { text: fmtDate(due), color: 'var(--muted)' };
  }

  // --- Add ---
  function resetAddPanel() {
    newItemText.value = '';
    newItemType.value = 'simple';
    newItemInterval.value = 7;
    newItemSubtasks.value = '';
    newItemDueProject.value = '';
    newItemDueSimple.value = '';
    document.getElementById('typeExtra-recurring').style.display = 'none';
    document.getElementById('typeExtra-project').style.display = 'none';
    document.getElementById('typeExtra-simple').style.display = 'block';
  }

  function openAddPanel(presetMode, presetId) {
    addPanel.style.display = 'block';
    if (presetMode === 'category') newItemCat.value = presetId;
    if (presetMode === 'assignee') newItemAssignee.value = presetId;
    newItemText.focus();
    addPanel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  async function addItem() {
    const text = newItemText.value.trim();
    if (!text) return;
    const category = newItemCat.value;
    const assignee = newItemAssignee.value;
    const task_type = newItemType.value;
    const payload = { text, category, assignee, task_type };

    if (task_type === 'recurring') {
      payload.interval_days = Number(newItemInterval.value) || 7;
      payload.next_due = todayISO();
    } else if (task_type === 'project') {
      payload.subtasks = newItemSubtasks.value.split('\n').map(s => s.trim()).filter(Boolean)
        .map((title, i) => ({ id: 'st-' + Date.now() + '-' + i, title, done: false }));
      payload.due_date = newItemDueProject.value || null;
    } else if (task_type === 'appointment') {
      payload.appt_state = 'needsScheduling';
      payload.done = false;
    } else {
      // simple or project_simple
      payload.due_date = newItemDueSimple.value || null;
      payload.done = false;
    }

    try {
      const [created] = await sb('todos', { method: 'POST', headers: { 'Prefer': 'return=representation' }, body: JSON.stringify(payload) });
      items.push(created);
      resetAddPanel();
      addPanel.style.display = 'none';
      clearBanner();
      render();
    } catch (e) {
      console.error('Add failed:', e);
      showBanner("Couldn't save that item. Try again in a moment.");
    }
  }

  // --- Mutations ---
  async function patchItem(id, patch, before) {
    pendingIds.add(id); render();
    try {
      await sb(`todos?id=eq.${id}`, { method: 'PATCH', body: JSON.stringify(patch) });
      clearBanner();
    } catch (e) {
      console.error('Update failed:', e);
      const item = items.find(i => i.id === id);
      if (item && before) Object.assign(item, before);
      showBanner("Couldn't save that change. Try again.");
    } finally {
      pendingIds.delete(id); render();
    }
  }

  function toggleDone(id) {
    const item = items.find(i => i.id === id); if (!item) return;
    const before = { done: item.done };
    item.done = !item.done;
    patchItem(id, { done: item.done }, before);
  }
  function completeRecurring(id) {
    const item = items.find(i => i.id === id); if (!item) return;
    const before = { next_due: item.next_due };
    item.next_due = addDaysISO(item.next_due, item.interval_days);
    patchItem(id, { next_due: item.next_due }, before);
  }
  function confirmApptDate(id) {
    const date = apptDateDrafts[id]; if (!date) return;
    const item = items.find(i => i.id === id); if (!item) return;
    const before = { appt_state: item.appt_state, due_date: item.due_date };
    item.appt_state = 'booked'; item.due_date = date;
    patchItem(id, { appt_state: 'booked', due_date: date }, before);
  }
  function markAttended(id) {
    const item = items.find(i => i.id === id); if (!item) return;
    const before = { done: item.done };
    item.done = true;
    patchItem(id, { done: true }, before);
  }
  function reopenAppt(id) {
    const item = items.find(i => i.id === id); if (!item) return;
    const before = { done: item.done };
    item.done = false;
    patchItem(id, { done: false }, before);
  }
  function toggleSubtask(itemId, subId) {
    const item = items.find(i => i.id === itemId); if (!item) return;
    const before = { subtasks: item.subtasks.map(s => ({ ...s })) };
    item.subtasks = item.subtasks.map(s => s.id === subId ? { ...s, done: !s.done } : s);
    patchItem(itemId, { subtasks: item.subtasks }, before);
  }

  async function deleteItem(id) {
    const idx = items.findIndex(i => i.id === id);
    if (idx === -1) return;
    const removed = { ...items[idx] };
    items.splice(idx, 1);
    render();
    try {
      await sb(`todos?id=eq.${id}`, { method: 'DELETE' });
      clearBanner();
      showToast(`Deleted "${removed.text}"`, () => undoDelete(removed, idx));
    } catch (e) {
      console.error('Delete failed:', e);
      items.splice(idx, 0, removed);
      showBanner("Couldn't delete that item. Try again.");
      render();
    }
  }

  async function undoDelete(removedItem, idx) {
    try {
      const payload = { ...removedItem };
      delete payload.id;
      const [created] = await sb('todos', { method: 'POST', headers: { 'Prefer': 'return=representation' }, body: JSON.stringify(payload) });
      items.splice(Math.min(idx, items.length), 0, created);
      clearBanner();
      render();
    } catch (e) {
      console.error('Undo failed:', e);
      showBanner("Couldn't undo that delete. You may need to re-add it manually.");
    }
  }

  async function saveSetting(key, value) {
    try {
      await sb('app_settings', { method: 'POST', headers: { 'Prefer': 'resolution=merge-duplicates' }, body: JSON.stringify({ key, value }) });
      clearBanner();
    } catch (e) {
      console.error('Saving setting failed:', e);
      showBanner("Couldn't save that preference, but it'll still work for this visit.");
    }
  }

  function updateGroupToggleUI() {
    [...groupToggle.querySelectorAll('button')].forEach(b => b.classList.toggle('active', b.dataset.group === groupBy));
  }

  // --- Edit ---
  function startEdit(item) {
    editingId = item.id;
    editDraft = {
      title: item.text,
      category: item.category,
      assignee: item.assignee,
      task_type: item.task_type,
      interval_days: item.interval_days || 7,
      due_date: item.due_date || '',
      appt_state: item.appt_state || 'needsScheduling',
      subtasks: item.subtasks ? item.subtasks.map(s => ({ ...s })) : [],
    };
    render();
  }
  function cancelEdit() { editingId = null; editDraft = null; render(); }

  async function saveEdit(id) {
    const item = items.find(i => i.id === id);
    if (!item || !editDraft) return;
    const before = { ...item, subtasks: item.subtasks ? item.subtasks.map(s => ({ ...s })) : item.subtasks };
    const patch = {
      text: editDraft.title.trim() || item.text,
      category: editDraft.category,
      assignee: editDraft.assignee,
      task_type: editDraft.task_type,
      done: !!item.done,
    };
    if (editDraft.task_type === 'recurring') {
      patch.interval_days = Number(editDraft.interval_days) || 7;
      patch.next_due = item.next_due || todayISO();
    } else if (editDraft.task_type === 'project') {
      patch.subtasks = editDraft.subtasks.filter(s => s.title.trim());
      patch.due_date = editDraft.due_date || null;
    } else if (editDraft.task_type === 'appointment') {
      patch.appt_state = editDraft.appt_state;
      patch.due_date = editDraft.appt_state === 'booked' ? (editDraft.due_date || null) : null;
    } else {
      // simple or project_simple
      patch.due_date = editDraft.due_date || null;
    }
    Object.assign(item, patch);
    editingId = null; editDraft = null;
    render();
    try {
      await sb(`todos?id=eq.${id}`, { method: 'PATCH', body: JSON.stringify(patch) });
      clearBanner();
    } catch (e) {
      console.error('Save edit failed:', e);
      Object.assign(item, before);
      showBanner("Couldn't save those changes. Try again.");
      render();
    }
  }

  function makeSelect(options, currentValue, onChange) {
    const sel = document.createElement('select');
    options.forEach(o => {
      const opt = document.createElement('option');
      opt.value = o.id; opt.textContent = o.label;
      if (o.id === currentValue) opt.selected = true;
      sel.appendChild(opt);
    });
    sel.addEventListener('change', (e) => onChange(e.target.value));
    return sel;
  }

  function renderEditForm(item) {
    const wrap = document.createElement('div');
    wrap.className = 'edit-form';

    const titleInput = document.createElement('input');
    titleInput.type = 'text';
    titleInput.value = editDraft.title;
    titleInput.addEventListener('input', (e) => { editDraft.title = e.target.value; });
    wrap.appendChild(titleInput);

    const typeLabel = document.createElement('div');
    typeLabel.className = 'field-label'; typeLabel.textContent = 'Type';
    wrap.appendChild(typeLabel);
    const typeSel = makeSelect(TASK_TYPES, editDraft.task_type, v => {
      editDraft.task_type = v;
      if (v === 'recurring' && !editDraft.interval_days) editDraft.interval_days = 7;
      if (v === 'appointment' && !editDraft.appt_state) editDraft.appt_state = 'needsScheduling';
      if (v === 'project' && !editDraft.subtasks) editDraft.subtasks = [];
      render();
    });
    wrap.appendChild(typeSel);

    const row = document.createElement('div');
    row.className = 'edit-row';
    row.appendChild(makeSelect(CATEGORIES, editDraft.category, v => { editDraft.category = v; }));
    row.appendChild(makeSelect(ASSIGNEES, editDraft.assignee, v => { editDraft.assignee = v; }));
    wrap.appendChild(row);

    if (editDraft.task_type === 'recurring') {
      const label = document.createElement('div');
      label.className = 'field-label'; label.textContent = 'Repeats every (days)';
      wrap.appendChild(label);
      const intervalInput = document.createElement('input');
      intervalInput.type = 'number'; intervalInput.min = 1; intervalInput.value = editDraft.interval_days;
      intervalInput.addEventListener('input', (e) => { editDraft.interval_days = e.target.value; });
      wrap.appendChild(intervalInput);
    } else if (editDraft.task_type === 'project') {
      const label = document.createElement('div');
      label.className = 'field-label'; label.textContent = 'Steps';
      wrap.appendChild(label);
      editDraft.subtasks.forEach((s, idx) => {
        const stRow = document.createElement('div');
        stRow.className = 'edit-subtask-row';
        const cb = document.createElement('input');
        cb.type = 'checkbox'; cb.checked = s.done;
        cb.addEventListener('change', () => { editDraft.subtasks[idx].done = !editDraft.subtasks[idx].done; render(); });
        const titleIn = document.createElement('input');
        titleIn.type = 'text'; titleIn.value = s.title;
        titleIn.addEventListener('input', (e) => { editDraft.subtasks[idx].title = e.target.value; });
        const rm = document.createElement('button');
        rm.type = 'button'; rm.textContent = '✕';
        rm.addEventListener('click', () => { editDraft.subtasks.splice(idx, 1); render(); });
        stRow.appendChild(cb); stRow.appendChild(titleIn); stRow.appendChild(rm);
        wrap.appendChild(stRow);
      });
      const addStepBtn = document.createElement('button');
      addStepBtn.type = 'button'; addStepBtn.className = 'edit-add-step'; addStepBtn.textContent = '+ Add step';
      addStepBtn.addEventListener('click', () => { editDraft.subtasks.push({ id: 'st-' + Date.now(), title: '', done: false }); render(); });
      wrap.appendChild(addStepBtn);

      const dueLabel = document.createElement('div');
      dueLabel.className = 'field-label'; dueLabel.textContent = 'Due date (optional)';
      wrap.appendChild(dueLabel);
      const dueInput = document.createElement('input');
      dueInput.type = 'date'; dueInput.value = editDraft.due_date;
      dueInput.addEventListener('input', (e) => { editDraft.due_date = e.target.value; });
      wrap.appendChild(dueInput);
    } else if (editDraft.task_type === 'appointment') {
      const stateSel = document.createElement('select');
      [['needsScheduling', 'Needs scheduling'], ['booked', 'Booked']].forEach(([val, lbl]) => {
        const opt = document.createElement('option'); opt.value = val; opt.textContent = lbl;
        if (val === editDraft.appt_state) opt.selected = true;
        stateSel.appendChild(opt);
      });
      stateSel.addEventListener('change', (e) => { editDraft.appt_state = e.target.value; render(); });
      wrap.appendChild(stateSel);
      if (editDraft.appt_state === 'booked') {
        const dueInput = document.createElement('input');
        dueInput.type = 'date'; dueInput.value = editDraft.due_date;
        dueInput.addEventListener('input', (e) => { editDraft.due_date = e.target.value; });
        wrap.appendChild(dueInput);
      }
    } else {
      const dueLabel = document.createElement('div');
      dueLabel.className = 'field-label'; dueLabel.textContent = 'Due date (optional)';
      wrap.appendChild(dueLabel);
      const dueInput = document.createElement('input');
      dueInput.type = 'date'; dueInput.value = editDraft.due_date;
      dueInput.addEventListener('input', (e) => { editDraft.due_date = e.target.value; });
      wrap.appendChild(dueInput);
    }

    const actions = document.createElement('div');
    actions.className = 'edit-actions';
    const cancelBtn = document.createElement('button');
    cancelBtn.className = 'btn-ghost'; cancelBtn.textContent = 'Cancel';
    cancelBtn.addEventListener('click', cancelEdit);
    const saveBtn = document.createElement('button');
    saveBtn.className = 'btn-primary'; saveBtn.textContent = 'Save';
    saveBtn.addEventListener('click', () => saveEdit(item.id));
    actions.appendChild(cancelBtn); actions.appendChild(saveBtn);
    wrap.appendChild(actions);

    return wrap;
  }

  // --- Render ---
  function renderItemActions(item) {
    const wrap = document.createElement('div');
    wrap.className = 'type-actions';
    const done = isDone(item);
    if (item.task_type === 'recurring') {
      const btn = document.createElement('button'); btn.className = 'btn-sm'; btn.textContent = 'Done this cycle';
      btn.addEventListener('click', () => completeRecurring(item.id));
      wrap.appendChild(btn);
    } else if (item.task_type === 'appointment' && item.appt_state === 'needsScheduling') {
      const dateInput = document.createElement('input');
      dateInput.type = 'date'; dateInput.className = 'date-input-sm'; dateInput.value = apptDateDrafts[item.id] || '';
      dateInput.addEventListener('change', (e) => { apptDateDrafts[item.id] = e.target.value; });
      const btn = document.createElement('button'); btn.className = 'btn-sm'; btn.textContent = 'Confirm';
      btn.addEventListener('click', () => confirmApptDate(item.id));
      wrap.appendChild(dateInput); wrap.appendChild(btn);
    } else if (item.task_type === 'appointment' && item.appt_state === 'booked' && !done) {
      const btn = document.createElement('button'); btn.className = 'btn-sm'; btn.textContent = 'Mark attended';
      btn.addEventListener('click', () => markAttended(item.id));
      wrap.appendChild(btn);
    } else if (item.task_type === 'appointment' && done) {
      const btn = document.createElement('button'); btn.className = 'btn-sm reopen'; btn.textContent = 'Reopen';
      btn.addEventListener('click', () => reopenAppt(item.id));
      wrap.appendChild(btn);
    }
    return wrap.children.length ? wrap : null;
  }

  function renderItem(item) {
    const row = document.createElement('div');

    if (editingId === item.id) {
      row.className = 'item';
      row.appendChild(renderEditForm(item));
      return row;
    }

    const done = isDone(item);
    const cat = catMeta(item.category);
    const assignee = assigneeMeta(item.assignee);
    const badge = dueBadge(item);

    row.className = 'item' + (done ? ' done' : '') + (pendingIds.has(item.id) ? ' pending' : '');

    const top = document.createElement('div');
    top.className = 'item-top';

    if (item.task_type === 'simple' || item.task_type === 'project_simple' || item.task_type === 'appointment' ||
        (item.task_type === 'project' && (!item.subtasks || item.subtasks.length === 0))) {
      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox'; checkbox.checked = done;
      checkbox.disabled = item.task_type === 'appointment';
      if (item.task_type !== 'appointment') checkbox.addEventListener('change', () => toggleDone(item.id));
      top.appendChild(checkbox);
    } else {
      const spacer = document.createElement('div');
      spacer.style.width = '18px'; spacer.style.flexShrink = '0';
      top.appendChild(spacer);
    }

    const mid = document.createElement('div');
    mid.style.flex = '1'; mid.style.minWidth = '0';

    const contentRow = document.createElement('div');
    contentRow.className = 'content-row';

    const text = document.createElement('div');
    text.className = 'item-text';
    text.textContent = item.text;
    text.addEventListener('click', () => startEdit(item));
    contentRow.appendChild(text);

    const typeLabel = typeBadgeLabel(item.task_type);
    if (typeLabel) {
      const typeBadge = document.createElement('span');
      typeBadge.className = 'badge-outline'; typeBadge.style.color = 'var(--muted)'; typeBadge.textContent = typeLabel;
      contentRow.appendChild(typeBadge);
    }

    const assigneeBadge = document.createElement('span');
    assigneeBadge.className = 'badge'; assigneeBadge.style.background = assignee.color; assigneeBadge.textContent = assignee.label;
    contentRow.appendChild(assigneeBadge);
    if (groupBy !== 'category') {
      const catBadge = document.createElement('span');
      catBadge.className = 'badge-outline'; catBadge.style.color = cat.color; catBadge.textContent = cat.label;
      contentRow.appendChild(catBadge);
    }
    if (badge) {
      const b = document.createElement('span');
      b.className = 'badge-outline'; b.style.color = badge.color; b.textContent = badge.text;
      contentRow.appendChild(b);
    }
    if (item.task_type === 'project' && item.subtasks && item.subtasks.length) {
      const doneCt = item.subtasks.filter(s => s.done).length;
      const stepsBadge = document.createElement('span');
      stepsBadge.className = 'badge-outline'; stepsBadge.style.color = 'var(--muted)';
      stepsBadge.textContent = `${doneCt}/${item.subtasks.length} steps`;
      contentRow.appendChild(stepsBadge);
    }
    mid.appendChild(contentRow);

    if (item.task_type === 'project' && item.subtasks && item.subtasks.length) {
      const doneCt = item.subtasks.filter(s => s.done).length;
      const bar = document.createElement('div'); bar.className = 'progress-bar';
      const fill = document.createElement('div'); fill.className = 'progress-fill';
      fill.style.width = `${(doneCt / item.subtasks.length) * 100}%`;
      bar.appendChild(fill); mid.appendChild(bar);

      const expandBtn = document.createElement('button');
      expandBtn.className = 'expand-btn';
      const isExpanded = expandedIds.has(item.id);
      expandBtn.textContent = isExpanded ? 'Hide steps' : 'Show steps';
      expandBtn.addEventListener('click', () => { isExpanded ? expandedIds.delete(item.id) : expandedIds.add(item.id); render(); });
      mid.appendChild(expandBtn);

      if (isExpanded) {
        const stWrap = document.createElement('div'); stWrap.className = 'subtasks';
        item.subtasks.forEach(s => {
          const stRow = document.createElement('label');
          stRow.className = 'subtask' + (s.done ? ' done' : '');
          const cb = document.createElement('input');
          cb.type = 'checkbox'; cb.checked = s.done;
          cb.addEventListener('change', () => toggleSubtask(item.id, s.id));
          const label = document.createElement('span'); label.textContent = s.title;
          stRow.appendChild(cb); stRow.appendChild(label);
          stWrap.appendChild(stRow);
        });
        mid.appendChild(stWrap);
      }
    }

    const actions = renderItemActions(item);
    if (actions) mid.appendChild(actions);

    top.appendChild(mid);

    const del = document.createElement('button');
    del.className = 'del-btn'; del.textContent = '✕';
    del.addEventListener('click', () => deleteItem(item.id));
    top.appendChild(del);

    row.appendChild(top);
    return row;
  }

  function renderSummary() {
    const active = items.filter(i => !isDone(i));
    let overdue = 0, dueToday = 0, action = 0;
    active.forEach(i => {
      const u = getUrgency(i);
      if (u === 'overdue') overdue++;
      else if (u === 'dueToday') dueToday++;
      else if (u === 'action') action++;
    });
    const parts = [];
    if (overdue) parts.push(`${overdue} overdue`);
    if (dueToday) parts.push(`${dueToday} due today`);
    if (action) parts.push(`${action} need${action === 1 ? 's' : ''} scheduling`);

    if (parts.length === 0) {
      summaryLine.textContent = 'Nothing urgent right now.';
      summaryLine.classList.add('calm');
    } else {
      summaryLine.textContent = parts.join(' · ');
      summaryLine.classList.remove('calm');
    }
  }

  function render() {
    renderSummary();
    board.className = '';
    board.innerHTML = '';

    if (groupBy === 'urgency') {
      URGENCY_BUCKETS.forEach(bucket => {
        const allBucketItems = items.filter(i => getUrgency(i) === bucket.id);
        const bucketItems = hideCompleted ? allBucketItems.filter(i => !isDone(i)) : allBucketItems;
        if (bucketItems.length === 0) return;

        const section = document.createElement('div');
        section.className = 'category';
        const labelRow = document.createElement('div');
        labelRow.className = 'cat-label-row';
        const label = document.createElement('div');
        label.className = 'cat-label';
        label.innerHTML = `<span class="dot" style="background:${bucket.color}"></span>${bucket.label}`;
        labelRow.appendChild(label);
        section.appendChild(labelRow);

        const card = document.createElement('div'); card.className = 'card';
        bucketItems.forEach(item => card.appendChild(renderItem(item)));
        section.appendChild(card);
        board.appendChild(section);
      });
      return;
    }

    const groups = groupBy === 'assignee' ? ASSIGNEES : CATEGORIES;
    const groupKeyOf = (item) => groupBy === 'assignee' ? item.assignee : item.category;

    groups.forEach(g => {
      const allGroupItems = items.filter(i => groupKeyOf(i) === g.id);
      const groupItems = hideCompleted ? allGroupItems.filter(i => !isDone(i)) : allGroupItems;
      const section = document.createElement('div');
      section.className = 'category';

      const labelRow = document.createElement('div');
      labelRow.className = 'cat-label-row';
      const label = document.createElement('div');
      label.className = 'cat-label';
      label.innerHTML = `<span class="dot" style="background:${g.color}"></span>${g.label}`;
      labelRow.appendChild(label);
      const quickAdd = document.createElement('button');
      quickAdd.className = 'quick-add-btn'; quickAdd.textContent = '+';
      quickAdd.addEventListener('click', () => openAddPanel(groupBy, g.id));
      labelRow.appendChild(quickAdd);
      section.appendChild(labelRow);

      const card = document.createElement('div'); card.className = 'card';
      if (groupItems.length === 0) {
        const empty = document.createElement('div'); empty.className = 'empty-cat';
        empty.textContent = allGroupItems.length === 0 ? 'Nothing here yet.' : 'All done here.';
        card.appendChild(empty);
      } else {
        groupItems.forEach(item => card.appendChild(renderItem(item)));
      }
      section.appendChild(card);
      board.appendChild(section);
    });
  }

  // --- Wiring ---
  addToggleBtn.addEventListener('click', () => { addPanel.style.display = addPanel.style.display === 'none' ? 'block' : 'none'; });
  cancelAddBtn.addEventListener('click', () => { resetAddPanel(); addPanel.style.display = 'none'; });
  addBtn.addEventListener('click', addItem);
  newItemType.addEventListener('change', () => {
    const t = newItemType.value;
    document.getElementById('typeExtra-recurring').style.display = t === 'recurring' ? 'block' : 'none';
    document.getElementById('typeExtra-project').style.display = t === 'project' ? 'block' : 'none';
    document.getElementById('typeExtra-simple').style.display = (t === 'simple' || t === 'project_simple') ? 'block' : 'none';
  });
  hideCompletedToggle.addEventListener('change', () => {
    hideCompleted = hideCompletedToggle.checked;
    render();
    saveSetting('hideCompleted', hideCompleted);
  });
  groupToggle.addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-group]');
    if (!btn) return;
    groupBy = btn.dataset.group;
    updateGroupToggleUI();
    render();
    saveSetting('groupBy', groupBy);
  });

  // --- Realtime sync (so Mike's and Meesh's phones stay in sync live) ---
  function setupRealtime() {
    const sbClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    sbClient
      .channel('family-todo-sync')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'todos' }, handleTodoChange)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'app_settings' }, handleSettingChange)
      .subscribe((status) => {
        if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') {
          console.error('Realtime subscription issue:', status);
        }
      });
  }

  function handleTodoChange(payload) {
    if (payload.eventType === 'DELETE') {
      const id = payload.old.id;
      if (editingId === id) { editingId = null; editDraft = null; }
      items = items.filter(i => i.id !== id);
      render();
      return;
    }
    const row = payload.new;
    if (editingId === row.id) return; // don't yank the form out from under an active edit
    const idx = items.findIndex(i => i.id === row.id);
    if (idx === -1) items.push(row); else items[idx] = row;
    render();
  }

  function handleSettingChange(payload) {
    if (payload.eventType === 'DELETE') return;
    const row = payload.new;
    if (row.key === 'hideCompleted') {
      hideCompleted = row.value === true;
      hideCompletedToggle.checked = hideCompleted;
    } else if (row.key === 'groupBy' && ['assignee', 'category', 'urgency'].includes(row.value)) {
      groupBy = row.value;
      updateGroupToggleUI();
    }
    render();
  }

  loadAll();
  setupRealtime();
</script>
</body>
</html>
